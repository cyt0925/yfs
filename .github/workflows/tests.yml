# 每次推分支都跑三套測試（SQLite 一組、PostgreSQL 一組）。
# 正式站（Render）接的是 claude/coupang-order-system-design-n17g7z，
# 建議到 Render 服務設定把「Auto-Deploy」改成「等 CI 通過才部署」，紅燈就不會上線。
name: tests

on:
  push:
    paths: ["coupang-oms/**", ".github/workflows/tests.yml"]
  pull_request:
    paths: ["coupang-oms/**", ".github/workflows/tests.yml"]

jobs:
  sqlite:
    name: SQLite（本機模式）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: coupang-oms
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: coupang-oms/requirements.txt
      - run: pip install -r requirements.txt
      - name: test_flow（訂單管理）
        run: python test_flow.py
      - name: test_purchase（採購表轉換）
        run: python test_purchase.py
      - name: test_master（商品主檔自動化）
        run: python test_master.py

  postgres:
    name: PostgreSQL（正式站模式）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: coupang-oms
    services:
      pg:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: oms
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/oms
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: coupang-oms/requirements.txt
      - run: pip install -r requirements.txt
      - name: test_flow（訂單管理）
        run: python test_flow.py
      - name: test_purchase（採購表轉換）
        run: python test_purchase.py
      - name: test_master（商品主檔自動化）
        run: python test_master.py

  ui:
    name: 前端煙霧測試（Playwright）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: coupang-oms
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: coupang-oms/requirements.txt
      - run: pip install -r requirements.txt playwright
      - run: playwright install --with-deps chromium
      - name: test_master_ui（開真的瀏覽器點一遍）
        run: python test_master_ui.py
