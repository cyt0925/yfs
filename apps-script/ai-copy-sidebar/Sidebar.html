<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --citrus: #D9520A; --citrus-dark: #B8440A;
    --ink: #1C1815; --ink-2: #453D35; --muted: #6E645A;
    --surface: #F8F5F1; --surface-2: #F1ECE5; --rule: #E3DCD3;
    --good: #1F6B45; --bad: #A32118; --info-bg: #FFF4EC;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 14px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Microsoft JhengHei", sans-serif;
    font-size: 13px; line-height: 1.55; color: var(--ink); background: #fff;
  }
  h1 { font-size: 15px; font-weight: 700; margin: 0 0 10px; }
  h2 {
    font-size: 13px; font-weight: 700; margin: 0; padding: 10px 0;
    display: flex; align-items: center; gap: 8px; cursor: pointer; user-select: none;
  }
  h2 .num {
    display: inline-flex; align-items: center; justify-content: center;
    width: 20px; height: 20px; border-radius: 50%; background: var(--citrus); color: #fff; font-size: 11px;
  }
  h2 .chev { margin-left: auto; color: var(--muted); font-size: 11px; font-weight: 400; }
  section { border-top: 1px solid var(--rule); }
  section .body { padding: 0 0 14px; }
  section.collapsed .body { display: none; }
  section.collapsed h2 .chev::before { content: "展開 ▸"; }
  section:not(.collapsed) h2 .chev::before { content: "收合 ▾"; }

  .context {
    background: var(--surface); border: 1px solid var(--rule); border-radius: 8px;
    padding: 10px 12px; margin-bottom: 12px; font-size: 12.5px;
  }
  .context .row { display: flex; justify-content: space-between; gap: 8px; margin-bottom: 4px; }
  .context .k { color: var(--muted); white-space: nowrap; }
  .context .v { font-weight: 600; text-align: right; word-break: break-all; }
  .warn { color: var(--bad); font-weight: 600; }
  .hint { font-size: 11.5px; color: var(--muted); margin-top: 4px; }
  .small-btn {
    display: inline-block; margin-top: 6px; font-size: 11.5px; color: var(--citrus);
    background: #fff; border: 1px solid var(--rule); border-radius: 6px; padding: 3px 9px; cursor: pointer;
  }
  .small-btn:hover { background: var(--surface-2); }
  .small-btn:disabled { color: #B9AFA4; cursor: not-allowed; }

  label { display: block; font-size: 12px; font-weight: 600; color: var(--ink-2); margin: 10px 0 4px; }
  label .opt { font-weight: 400; color: var(--muted); }
  input[type=text], select, textarea {
    width: 100%; padding: 7px 9px; font-size: 13px; border: 1px solid var(--rule); border-radius: 6px;
    background: #fff; color: var(--ink); font-family: inherit;
  }
  textarea { resize: vertical; min-height: 56px; line-height: 1.45; }
  input:focus, select:focus, textarea:focus { outline: 2px solid var(--citrus); outline-offset: -1px; }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .three { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
  input[type=range] { width: 100%; }

  .primary-btn {
    width: 100%; margin-top: 12px; padding: 10px; font-size: 13.5px; font-weight: 600; color: #fff;
    background: var(--citrus); border: 0; border-radius: 8px; cursor: pointer;
  }
  .primary-btn:hover { background: var(--citrus-dark); }
  .primary-btn:disabled { background: #D8CFC5; cursor: not-allowed; }
  .secondary-btn {
    width: 100%; margin-top: 8px; padding: 9px; font-size: 13px; font-weight: 600; color: var(--citrus);
    background: #fff; border: 1px solid var(--citrus); border-radius: 8px; cursor: pointer;
  }
  .secondary-btn:disabled { color: #B9AFA4; border-color: var(--rule); cursor: not-allowed; }

  .status { margin-top: 8px; font-size: 12.5px; color: var(--muted); display: none; white-space: pre-wrap; }
  .status.show { display: block; }
  .status.error { color: var(--bad); }

  /* 拖放區 */
  .drop {
    border: 2px dashed var(--rule); border-radius: 10px; padding: 12px; text-align: center;
    background: var(--surface); color: var(--muted); font-size: 12px; cursor: pointer; transition: border-color .15s, background .15s;
  }
  .drop:hover, .drop.over { border-color: var(--citrus); background: var(--info-bg); color: var(--ink-2); }
  .drop b { color: var(--citrus); }
  .drop input[type=file] { display: none; }
  .url-row { display: flex; gap: 6px; margin-top: 6px; }
  .url-row input { flex: 1; font-size: 12px; }
  .url-row button { white-space: nowrap; }

  .thumbs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 8px; }
  .thumb {
    position: relative; border: 2px solid var(--rule); border-radius: 8px; padding: 4px; background: #fff; text-align: center;
  }
  .thumb.selected, .thumb.added { border-color: var(--citrus); background: var(--info-bg); }
  .thumb img {
    width: 100%; height: 64px; object-fit: contain; display: block; border-radius: 4px;
    background: repeating-conic-gradient(#f3f0eb 0 25%, #fff 0 50%) 0 0 / 12px 12px;
  }
  .thumb .n { font-size: 10.5px; margin-top: 3px; color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .thumb .x {
    position: absolute; top: -6px; right: -6px; width: 18px; height: 18px; border-radius: 50%;
    background: var(--ink); color: #fff; border: 0; font-size: 11px; line-height: 18px; cursor: pointer; padding: 0;
  }
  .thumb .mv {
    position: absolute; top: -6px; left: -6px; height: 18px; border-radius: 9px; padding: 0 6px;
    background: #fff; color: var(--citrus); border: 1px solid var(--citrus); font-size: 10px; line-height: 16px; cursor: pointer;
  }
  .thumb.lib { cursor: pointer; }
  .thumb .ph { height: 64px; display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: 11px; }

  .analysis {
    margin-top: 8px; padding: 10px 12px; border-radius: 8px; background: var(--info-bg); border: 1px solid #F3D9C4; font-size: 12.5px;
  }
  .analysis .t { font-weight: 700; margin-bottom: 4px; }
  .analysis .c { color: var(--bad); margin-top: 6px; }

  .angles { display: grid; gap: 6px; margin-top: 8px; }
  .angle { border: 1px solid var(--rule); border-radius: 8px; padding: 8px 10px; cursor: pointer; background: #fff; }
  .angle:hover { background: var(--surface); }
  .angle.selected { border-color: var(--citrus); background: var(--info-bg); }
  .angle .t { font-weight: 700; font-size: 12.5px; }
  .angle .h { font-size: 12.5px; margin: 2px 0; }
  .angle .w { font-size: 11.5px; color: var(--muted); }

  .cards { display: grid; gap: 10px; margin-top: 12px; }
  .card { border: 1px solid var(--rule); border-radius: 8px; padding: 10px 11px; background: var(--surface); cursor: pointer; }
  .card.selected { border-color: var(--citrus); background: var(--info-bg); }
  .card .label { font-size: 11px; color: var(--muted); font-weight: 700; margin-bottom: 5px; }
  .card .text { white-space: pre-wrap; font-size: 13px; margin-bottom: 8px; }
  .copy-btn {
    font-size: 11.5px; font-weight: 600; color: var(--citrus); background: #fff;
    border: 1px solid var(--citrus); border-radius: 6px; padding: 4px 10px; cursor: pointer;
  }
  .copy-btn[data-done="1"] { color: var(--good); border-color: var(--good); }

  .prompt-box { font-size: 11.5px; color: var(--ink-2); min-height: 120px; }
  .result { margin-top: 12px; text-align: center; }
  .result img { max-width: 100%; border-radius: 8px; border: 1px solid var(--rule); }
  .actions { display: flex; gap: 8px; margin-top: 8px; }
  .actions a, .actions button {
    flex: 1; text-align: center; font-size: 12px; font-weight: 600; padding: 7px; border-radius: 6px;
    border: 1px solid var(--rule); background: #fff; color: var(--ink); text-decoration: none; cursor: pointer;
  }
  details.lib { margin-top: 8px; }
  details.lib summary { font-size: 12px; color: var(--muted); cursor: pointer; }
  .brief { white-space: pre-wrap; font-size: 12px; background: var(--surface); border: 1px solid var(--rule); border-radius: 8px; padding: 10px; margin-top: 8px; }
  footer { margin-top: 18px; font-size: 11px; color: var(--muted); border-top: 1px solid var(--rule); padding-top: 10px; }
</style>

<h1>🍊 AI 文案助手</h1>

<div class="context" id="context"><div class="row"><span class="k">讀取中…</span></div></div>

<!-- ① 參考圖 -->
<section id="secRef">
  <h2 onclick="toggle('secRef')"><span class="num">1</span>參考圖與產品圖<span class="chev"></span></h2>
  <div class="body">
    <label style="margin-top:0">參考圖 <span class="opt">（網路上找到「想要這種感覺」的圖）</span></label>
    <div class="drop" id="dropRef" onclick="document.getElementById('fileRef').click()">
      <b>拖圖片到這裡</b>、點選檔案，或直接 <b>Ctrl+V</b> 貼上複製的圖片
      <input type="file" id="fileRef" accept="image/*" multiple onchange="addFiles(this.files, 'ref'); this.value=''">
    </div>
    <div class="url-row">
      <input type="text" id="urlRef" placeholder="或貼圖片網址（對圖片按右鍵 → 複製圖片網址）">
      <button class="small-btn" style="margin:0" onclick="addUrl('ref')">加入</button>
    </div>
    <div class="thumbs" id="refThumbs"></div>
    <div class="status" id="refStatus"></div>

    <label>補充說明 <span class="opt">（選填，例：我想要這種藍色但要更亮、產品放下面）</span></label>
    <input type="text" id="refNote" placeholder="想保留什麼、想改什麼">
    <button class="secondary-btn" id="analyzeBtn" onclick="analyzeRefs()">讓 AI 分析參考圖的配色、風格、構圖</button>
    <div class="status" id="analyzeStatus"></div>
    <div id="analysisBox"></div>

    <label>產品去背圖 <span class="opt">（選填，要把自家產品放進畫面時才需要）</span></label>
    <div class="drop" id="dropProd" onclick="document.getElementById('fileProd').click()">
      <b>拖去背 PNG 到這裡</b> 或點選檔案
      <input type="file" id="fileProd" accept="image/*" multiple onchange="addFiles(this.files, 'prod'); this.value=''">
    </div>
    <div class="thumbs" id="prodThumbs"></div>
    <div class="status" id="prodStatus"></div>

    <details class="lib" id="libDetails">
      <summary>從雲端硬碟常用素材庫加入（選用，放每次都會用的產品圖與 logo）</summary>
      <div class="hint" id="libHint">讀取中…</div>
      <div class="thumbs" id="libProdThumbs"></div>
      <div class="thumbs" id="libRefThumbs"></div>
      <button class="small-btn" onclick="loadAssets()">重新讀取</button>
    </details>
  </div>
</section>

<!-- ② 文案 -->
<section id="secCopy">
  <h2 onclick="toggle('secCopy')"><span class="num">2</span>文案<span class="chev"></span></h2>
  <div class="body">
    <label style="margin-top:0">商品 <span class="opt">（可修改）</span></label>
    <input type="text" id="product" placeholder="例：洗衣膠囊*3盒" oninput="productTouched = true">
    <div class="hint" id="productInfoHint"></div>

    <label>商品賣點／差異點 <span class="opt">（選填）</span></label>
    <input type="text" id="sellingPoint" placeholder="例：一球即淨、不用計量">

    <label>文案調性</label>
    <select id="tone"></select>

    <label>本週時事／梗料 <span class="opt">（選填，寫清楚事件＋跟洗衣清潔的關聯）</span></label>
    <textarea id="trend" placeholder="例：颱風假連放兩天，大家都在家追劇、叫外送，衣服堆到週一才洗"></textarea>

    <button class="secondary-btn" id="angleBtn" onclick="proposeAngles()">先請 AI 提 5 個切角（有填時事才需要）</button>
    <div class="status" id="angleStatus"></div>
    <div class="angles" id="angles"></div>

    <button class="primary-btn" id="genCopyBtn" onclick="generateCopy()">生成 3 版文案</button>
    <div class="status" id="copyStatus"></div>
    <div class="cards" id="cards"></div>
  </div>
</section>

<!-- ③ 生圖 -->
<section id="secImage" class="collapsed">
  <h2 onclick="toggle('secImage')"><span class="num">3</span>生圖<span class="chev"></span></h2>
  <div class="body">
    <div class="two">
      <div><label style="margin-top:0">主色調</label><select id="palette" onchange="onPaletteChange()"></select></div>
      <div><label style="margin-top:0">視覺風格</label><select id="visualStyle" onchange="rebuildPrompt()"></select></div>
    </div>
    <div id="customPaletteWrap" style="display:none">
      <label>自訂顏色描述 <span class="opt">（英文較準）</span></label>
      <input type="text" id="customPalette" placeholder="e.g. deep navy with warm gold accents" oninput="rebuildPromptDebounced()">
    </div>
    <div class="two">
      <div><label>版面</label><select id="layout" onchange="rebuildPrompt()"></select></div>
      <div><label>圖片比例</label><select id="ratio" onchange="rebuildPrompt()"></select></div>
    </div>
    <div class="hint" id="imageInputsHint"></div>

    <label>生圖 Prompt <span class="opt">（可直接修改）</span></label>
    <textarea id="imagePrompt" class="prompt-box" placeholder="生成文案或分析參考圖後會自動組出 Prompt；也可以自己貼一段。"></textarea>
    <button class="small-btn" onclick="rebuildPrompt(true)">依上方選項重組 Prompt</button>

    <button class="primary-btn" id="genImageBtn" onclick="generateImage()">生成圖片</button>
    <div class="status" id="imageStatus"></div>
    <div class="result" id="imageResult"></div>
  </div>
</section>

<!-- ④ 合成 -->
<section id="secCompose" class="collapsed">
  <h2 onclick="toggle('secCompose')"><span class="num">4</span>疊上標題與產品<span class="chev"></span></h2>
  <div class="body">
    <div class="hint">把正確的中文標題、價格、logo 與真實去背產品疊到圖上。數字不會被 AI 改壞。</div>
    <label>主標 <span class="opt">（自動從「文案」列抓，可改）</span></label>
    <input type="text" id="headline" placeholder="例：滿$1099折$150">
    <label>副標</label>
    <input type="text" id="subline" placeholder="例：滿$2000送650點">
    <label>角標 <span class="opt">（檔期）</span></label>
    <input type="text" id="badge" placeholder="例：6.13-6.15 指定品">
    <div class="three">
      <div>
        <label>字色</label>
        <select id="textColor">
          <option value="auto">依主色調</option>
          <option value="#FFFFFF|#B8440A">白字橘邊</option>
          <option value="#FFFFFF|#1B4F9C">白字藍邊</option>
          <option value="#FFFFFF|#222222">白字黑邊</option>
          <option value="#D9520A|#FFFFFF">橘字白邊</option>
          <option value="#1B3F8B|#FFFFFF">藍字白邊</option>
          <option value="#1C1815|#FFFFFF">黑字白邊</option>
        </select>
      </div>
      <div>
        <label>字級 <span id="textScaleVal" class="opt">100%</span></label>
        <input type="range" id="textScale" min="60" max="150" value="100" oninput="document.getElementById('textScaleVal').textContent = this.value + '%'">
      </div>
      <div>
        <label>產品大小 <span id="productScaleVal" class="opt">100%</span></label>
        <input type="range" id="productScale" min="50" max="140" value="100" oninput="document.getElementById('productScaleVal').textContent = this.value + '%'">
      </div>
    </div>
    <label style="display:flex;gap:14px;align-items:center;font-weight:400">
      <span><input type="checkbox" id="overlayProducts" checked> 疊上產品去背圖</span>
      <span><input type="checkbox" id="overlayLogo" checked> 疊上 logo</span>
    </label>
    <div class="hint" id="composeHint"></div>
    <button class="primary-btn" id="composeBtn" onclick="composeDraft()">合成</button>
    <div class="status" id="composeStatus"></div>
    <div class="result" id="composeResult"></div>
  </div>
</section>

<!-- ⑤ 需求單 -->
<section id="secBrief" class="collapsed">
  <h2 onclick="toggle('secBrief')"><span class="num">5</span>給設計師的需求單<span class="chev"></span></h2>
  <div class="body">
    <div class="hint">把這次選定的文案、配色、版面、參考圖分析與標題整理成一段文字，複製給設計師。</div>
    <button class="secondary-btn" onclick="buildBrief()">產出需求單</button>
    <div class="brief" id="briefBox" style="display:none"></div>
    <button class="small-btn" id="briefCopyBtn" style="display:none" onclick="copyBrief(this)">複製需求單</button>
  </div>
</section>

<footer>
  文案只產出「前段情境鉤子」，價格／贈品／mo點請維持在「文案」列手動整合。這個工具不會改動試算表任何內容。
</footer>

<script>
  // ---------- 狀態 ----------
  let options = null, ctx = null;
  let productTouched = false, lastContextKey = "";
  let angles = [], selectedAngle = null;
  let copyResult = null, selectedCopyIndex = -1;
  let currentScene = "", refAnalysis = null;
  let currentImageBase64 = "", currentImageMode = "", currentDriveUrl = "";
  let composedDataUrl = "";
  const refImages = [];   // {id, name, mime, base64, dataUrl, source}
  const prodImages = [];
  let assets = { products: { exists: false, files: [] }, references: { exists: false, files: [] }, logo: null };
  let logoDataUrl = "";
  const REF_KEY = "跟參考圖一樣";
  let uid = 0;

  const $ = id => document.getElementById(id);
  function toggle(id) { $(id).classList.toggle("collapsed"); }
  function open(id) { $(id).classList.remove("collapsed"); }
  function setStatus(id, msg, isError) {
    const el = $(id); el.textContent = msg || "";
    el.className = "status" + (msg ? " show" : "") + (isError ? " error" : "");
  }
  function escapeHtml(s) {
    return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }
  function fillSelect(el, list, valueKey) {
    el.innerHTML = list.map(v => { const val = valueKey ? v[valueKey] : v; return '<option value="' + escapeHtml(val) + '">' + escapeHtml(val) + '</option>'; }).join("");
  }
  function run(fn) {
    // 把 google.script.run 包成 Promise
    return (...args) => new Promise((resolve, reject) => {
      google.script.run.withSuccessHandler(resolve).withFailureHandler(reject)[fn](...args);
    });
  }

  // ---------- 初始化 ----------
  function loadFormOptions() {
    run("getFormOptions")().then(opts => {
      options = opts;
      fillSelect($("tone"), opts.tones);
      $("tone").insertAdjacentHTML("afterbegin", '<option value="">請選擇</option>'); $("tone").value = "";
      fillSelect($("palette"), opts.palettes, "key");
      fillSelect($("visualStyle"), opts.visualStyles);
      fillSelect($("layout"), opts.layouts, "key");
      fillSelect($("ratio"), opts.ratios); $("ratio").value = "9:16";
    });
  }

  function loadContext(silent) {
    run("getColumnContext")().then(c => {
      const key = JSON.stringify(c);
      if (silent && key === lastContextKey) return;
      lastContextKey = key; ctx = c; renderContext(c);
    }).catch(err => {
      if (silent) return;
      $("context").innerHTML = '<div class="row warn">讀取失敗：' + escapeHtml(err.message) + '</div><button class="small-btn" onclick="loadContext()">重試</button>';
    });
  }

  function renderContext(c) {
    const el = $("context");
    if (!c.ok) {
      el.innerHTML = '<div class="row"><span class="warn">' + escapeHtml(c.message) + '</span></div><button class="small-btn" onclick="loadContext()">重新讀取</button>';
      return;
    }
    if (!productTouched) $("product").value = c.product || "";
    renderProductInfo(c.productInfo);
    prefillCompose(c);
    el.innerHTML =
      '<div class="row"><span class="k">分頁</span><span class="v">' + escapeHtml(c.sheetName) + '</span></div>' +
      '<div class="row"><span class="k">目前欄位</span><span class="v">' + escapeHtml(c.columnLabel) + ' 欄</span></div>' +
      '<div class="row"><span class="k">品類／廣告名稱</span><span class="v">' + escapeHtml(c.adName || c.product || "（空）") + '</span></div>' +
      (c.hasApiKey ? "" : '<div class="row"><span class="warn">尚未設定 API Key，請先執行選單「設定 OpenAI API Key」</span></div>') +
      '<button class="small-btn" onclick="productTouched=false; loadContext()">重新讀取目前欄位</button>';
  }

  function renderProductInfo(info) {
    $("productInfoHint").textContent = info
      ? "已帶入產品資料（" + info.source + "／" + info.key + "）：" + info.sellingPoints
      : "找不到這個品項的產品資料，AI 會依商品名稱推斷。可用選單「建立產品資料分頁」補資料。";
  }

  function prefillCompose(c) {
    const lines = String(c.copyText || "").split(/\r?\n/).map(s => s.trim()).filter(Boolean);
    const priceLines = lines.filter(l => /滿\s*\$?\s*\d/.test(l) && /(折|送|贈)/.test(l));
    const clean = s => s.replace(/^[^一-鿿\w$￥]+/, "").replace(/[^一-鿿\w$%)）]+$/, "").trim();
    if (!$("headline").value && priceLines[0]) $("headline").value = clean(priceLines[0]);
    if (!$("subline").value && priceLines[1]) $("subline").value = clean(priceLines[1]);
    if (!$("badge").value) {
      const m = (String(c.budgetText || "") + " " + String(c.copyText || "")).match(/(\d{1,2}\/\d{1,2})\s*[-~～–]\s*(\d{1,2}\/\d{1,2})/);
      if (m) $("badge").value = m[1].replace("/", ".") + "-" + m[2].replace("/", ".") + " 指定品";
    }
  }

  // ---------- ① 圖片加入：檔案／拖放／貼上／網址／素材庫 ----------
  function imageFromFile(file, kind) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => downscale(reader.result, kind).then(resolve).catch(reject);
      reader.onerror = () => reject(new Error("讀取檔案失敗"));
      reader.readAsDataURL(file);
    }).then(out => Object.assign(out, { name: (file.name || "image").replace(/\.[^.]+$/, "") }));
  }

  // 側邊欄先縮圖，避免傳給 Apps Script 太大。產品圖保留 PNG 透明；參考圖轉 JPEG。
  function downscale(dataUrl, kind) {
    return new Promise((resolve, reject) => {
      const img = new Image();
      img.onload = () => {
        const maxSide = kind === "prod" ? 1024 : 1536;
        const k = Math.min(1, maxSide / Math.max(img.naturalWidth, img.naturalHeight));
        const w = Math.round(img.naturalWidth * k), h = Math.round(img.naturalHeight * k);
        const canvas = document.createElement("canvas"); canvas.width = w; canvas.height = h;
        canvas.getContext("2d").drawImage(img, 0, 0, w, h);
        const isPngSrc = /^data:image\/png/.test(dataUrl) || /^data:image\/webp/.test(dataUrl);
        const keepPng = kind === "prod" || isPngSrc && kind !== "ref";
        const out = keepPng ? canvas.toDataURL("image/png") : canvas.toDataURL("image/jpeg", 0.88);
        const mime = keepPng ? "image/png" : "image/jpeg";
        resolve({ mime: mime, dataUrl: out, base64: out.split(",")[1], w: w, h: h });
      };
      img.onerror = () => reject(new Error("這不是可讀取的圖片"));
      img.src = dataUrl;
    });
  }

  function pushImage(kind, item, source) {
    const list = kind === "ref" ? refImages : prodImages;
    item.id = "img" + (++uid); item.source = source || "upload";
    list.push(item);
    renderImageList(kind);
  }

  function addFiles(files, kind) {
    const statusId = kind === "ref" ? "refStatus" : "prodStatus";
    const arr = Array.from(files || []).filter(f => /^image\//.test(f.type));
    if (!arr.length) { setStatus(statusId, "沒有可用的圖片檔。", true); return; }
    setStatus(statusId, "處理 " + arr.length + " 張圖片…", false);
    Promise.all(arr.map(f => imageFromFile(f, kind).then(item => pushImage(kind, item, "upload")).catch(e => setStatus(statusId, e.message, true))))
      .then(() => { if (!$(statusId).classList.contains("error")) setStatus(statusId, "", false); });
  }

  function addUrl(kind) {
    const input = $(kind === "ref" ? "urlRef" : "urlRef");
    const url = input.value.trim();
    const statusId = kind === "ref" ? "refStatus" : "prodStatus";
    if (!url) return;
    setStatus(statusId, "抓取圖片中…", false);
    run("fetchImageFromUrl")(url)
      .then(res => downscale(res.dataUrl, kind))
      .then(item => { item.name = url.split("/").pop().split("?")[0].replace(/\.[^.]+$/, "") || "網址圖片"; pushImage(kind, item, "url"); input.value = ""; setStatus(statusId, "", false); })
      .catch(err => setStatus(statusId, err.message, true));
  }

  function addFromLibrary(file, kind) {
    const statusId = kind === "ref" ? "refStatus" : "prodStatus";
    setStatus(statusId, "從雲端硬碟讀取「" + file.name + "」…", false);
    run("getFileBase64")(file.id)
      .then(res => downscale(res.dataUrl, kind))
      .then(item => { item.name = file.name; pushImage(kind, item, "drive"); setStatus(statusId, "", false); })
      .catch(err => setStatus(statusId, err.message, true));
  }

  function removeImage(kind, id) {
    const list = kind === "ref" ? refImages : prodImages;
    const i = list.findIndex(x => x.id === id);
    if (i !== -1) list.splice(i, 1);
    renderImageList(kind);
  }

  function moveImage(kind, id) {
    const from = kind === "ref" ? refImages : prodImages, to = kind === "ref" ? prodImages : refImages;
    const i = from.findIndex(x => x.id === id);
    if (i === -1) return;
    to.push(from.splice(i, 1)[0]);
    renderImageList("ref"); renderImageList("prod");
  }

  function renderImageList(kind) {
    const list = kind === "ref" ? refImages : prodImages;
    const grid = $(kind === "ref" ? "refThumbs" : "prodThumbs");
    grid.innerHTML = list.map(im =>
      '<div class="thumb added">' +
        '<button class="mv" title="移到另一類" onclick="moveImage(\'' + kind + '\',\'' + im.id + '\')">' + (kind === "ref" ? "→產品" : "→參考") + '</button>' +
        '<button class="x" title="移除" onclick="removeImage(\'' + kind + '\',\'' + im.id + '\')">×</button>' +
        '<img src="' + im.dataUrl + '">' +
        '<div class="n" title="' + escapeHtml(im.name) + '">' + escapeHtml(im.name) + '</div>' +
      '</div>'
    ).join("");
    updateImageInputsHint(); updateComposeHint();
  }

  // 拖放
  ["dropRef", "dropProd"].forEach(id => {
    const el = $(id), kind = id === "dropRef" ? "ref" : "prod";
    el.addEventListener("dragover", e => { e.preventDefault(); el.classList.add("over"); });
    el.addEventListener("dragleave", () => el.classList.remove("over"));
    el.addEventListener("drop", e => {
      e.preventDefault(); el.classList.remove("over");
      if (e.dataTransfer.files && e.dataTransfer.files.length) { addFiles(e.dataTransfer.files, kind); return; }
      // 從網頁直接拖圖片過來時會是網址
      const html = e.dataTransfer.getData("text/html");
      const m = html && html.match(/src="([^"]+)"/);
      const url = (m && m[1]) || e.dataTransfer.getData("text/uri-list") || e.dataTransfer.getData("text/plain");
      if (url && /^https?:\/\//.test(url)) { $("urlRef").value = url; addUrl(kind); }
    });
  });

  // Ctrl+V 貼圖（預設進參考圖；焦點在產品拖放區時進產品圖）
  document.addEventListener("paste", e => {
    const items = Array.from((e.clipboardData || {}).items || []);
    const files = items.filter(it => it.kind === "file" && /^image\//.test(it.type)).map(it => it.getAsFile());
    if (!files.length) return;
    if (document.activeElement && document.activeElement.tagName === "INPUT" && document.activeElement.type === "text") return;
    e.preventDefault();
    addFiles(files, "ref");
    open("secRef");
  });

  function copyText(btn, index) {

    writeClipboard(text, () => {
      btn.textContent = "已複製 ✓"; btn.setAttribute("data-done", "1");
      setTimeout(() => { btn.textContent = "複製"; btn.removeAttribute("data-done"); }, 2200);
    });
  }
  function writeClipboard(text, done) {
    const legacy = () => {
      const ta = document.createElement("textarea"); ta.value = text; ta.style.position = "fixed"; ta.style.top = "-1000px";
      document.body.appendChild(ta); ta.select(); try { document.execCommand("copy"); done(); } catch (e) {} document.body.removeChild(ta);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done).catch(legacy); else legacy();
  }

  // ---------- ③ 生圖 ----------
  function onPaletteChange() { $("customPaletteWrap").style.display = $("palette").value === "自訂" ? "block" : "none"; rebuildPrompt(); }
  let rebuildTimer = null;
  function rebuildPromptDebounced() { clearTimeout(rebuildTimer); rebuildTimer = setTimeout(() => rebuildPrompt(), 400); }
  function rebuildPrompt(force) {

  function updateImageInputsHint() {

    parts.push(refImages.length ? "會帶 " + refImages.length + " 張參考圖" : "沒有參考圖，純靠文字 Prompt");
    parts.push(prodImages.length ? "會把 " + prodImages.length + " 張產品圖畫進畫面" : "沒有產品圖，只畫背景");

  function generateImage() {

    $("genImageBtn").disabled = true; $("imageResult").innerHTML = ""; currentDriveUrl = "";
    const n = refImages.length + prodImages.length;
    setStatus("imageStatus", n ? "帶 " + n + " 張圖生成中…約 20～60 秒" : "生成中…約 10～30 秒", false);

    }).then(result => {

        : "背景完成。到第四步疊上標題" + (prodImages.length ? "與產品" : "") + "。", false);
      const dataUrl = "data:image/png;base64," + result.base64;

        '<div class="status show" id="imageDriveStatus" style="margin-top:6px"></div>';
      $("overlayProducts").checked = !prodImages.length ? false : result.mode !== "edits";

  function saveToDrive(base64, prefix, statusId, remember) {

      .then(result => { if (remember) currentDriveUrl = result.url; el.innerHTML = '已存入雲端硬碟「橘子工坊生圖」：<a href="' + result.url + '" target="_blank">開啟連結</a>'; })
      .catch(err => { el.textContent = "儲存失敗：" + err.message; });

  // ---------- ④ 合成 ----------
  function updateComposeHint() {
    const parts = [];
    parts.push(prodImages.length ? "可疊 " + prodImages.length + " 張產品去背圖" : "沒有產品圖（第一步加入）");
    parts.push(logoDataUrl ? "logo 就緒" : "沒有 logo（可放進雲端硬碟「橘子工坊品牌素材」）");
    if (currentImageMode === "edits" && prodImages.length) parts.push("圖裡已含 AI 畫的產品，預設不再疊");
    $("composeHint").textContent = parts.join("　｜　");
  }
  function loadImage(src) {
    return new Promise((resolve, reject) => { const img = new Image(); img.onload = () => resolve(img); img.onerror = () => reject(new Error("圖片載入失敗")); img.src = src; });
  }
  function currentPalette() {
    const key = $("palette").value;
    const found = (options.palettes || []).find(p => p.key === key);
    if (found) return found;
    return { textColor: "#FFFFFF", textStroke: "#333333", badgeColor: "#D9520A" }; // 跟參考圖一樣 → 中性預設
  }
  function roundRect(g, x, y, w, h, r) {
    g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r);
    g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath();
  }
  function fitFont(g, text, maxWidth, startSize, weight) {
    let size = startSize;
    while (size > 12) { g.font = weight + " " + size + "px 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif"; if (g.measureText(text).width <= maxWidth) break; size -= 2; }
    return size;
  }
  function drawOutlinedText(g, text, x, y, size, fill, stroke) {
    g.textAlign = "center"; g.textBaseline = "alphabetic"; g.lineJoin = "round";
    g.lineWidth = Math.max(2, size * 0.14); g.strokeStyle = stroke; g.strokeText(text, x, y); g.fillStyle = fill; g.fillText(text, x, y);
  }

  async function composeDraft() {
    if (!currentImageBase64) { setStatus("composeStatus", "請先在第三步生成圖片。", true); return; }
    $("composeBtn").disabled = true; setStatus("composeStatus", "合成中…", false);
    try {
      try { await document.fonts.load("900 40px 'Noto Sans TC'"); } catch (e) {}
      const bg = await loadImage("data:image/png;base64," + currentImageBase64);
      const W = bg.naturalWidth, H = bg.naturalHeight;
      const canvas = document.createElement("canvas"); canvas.width = W; canvas.height = H;
      const g = canvas.getContext("2d"); g.drawImage(bg, 0, 0, W, H);

      const layout = (options.layouts || []).find(l => l.key === $("layout").value) || options.layouts[0];
      const z = layout.zones, pal = currentPalette(), tc = $("textColor").value;
      const fill = tc === "auto" ? pal.textColor : tc.split("|")[0];
      const stroke = tc === "auto" ? pal.textStroke : tc.split("|")[1];
      const textScale = parseInt($("textScale").value, 10) / 100;
      const productScale = parseInt($("productScale").value, 10) / 100;

      if ($("overlayProducts").checked && prodImages.length) {
        const imgs = await Promise.all(prodImages.map(im => loadImage(im.dataUrl)));
        const zone = { x: z.products.x * W, y: z.products.y * H, w: z.products.w * W, h: z.products.h * H };
        let targetH = zone.h * 0.92 * productScale;
        const gap = zone.w * 0.03;
        let widths = imgs.map(im => im.naturalWidth / im.naturalHeight * targetH);
        let total = widths.reduce((a, b) => a + b, 0) + gap * (imgs.length - 1);
        if (total > zone.w) { const k = zone.w / total; targetH *= k; widths = widths.map(w => w * k); total = zone.w; }
        let x = zone.x + (zone.w - total) / 2; const bottom = zone.y + zone.h;
        imgs.forEach((im, i) => {
          const w = widths[i];
          g.save(); g.fillStyle = "rgba(0,0,0,0.22)"; g.filter = "blur(" + Math.round(W * 0.012) + "px)";
          g.beginPath(); g.ellipse(x + w / 2, bottom - targetH * 0.01, w * 0.42, targetH * 0.035, 0, 0, Math.PI * 2); g.fill(); g.restore();
          g.drawImage(im, x, bottom - targetH, w, targetH); x += w + gap;
        });
      }

      const hz = { x: z.headline.x * W, y: z.headline.y * H, w: z.headline.w * W, h: z.headline.h * H };
      const headline = $("headline").value.trim(), subline = $("subline").value.trim();
      const cx = hz.x + hz.w / 2; let cursorY = hz.y;
      if (headline) { const size = fitFont(g, headline, hz.w, hz.h * (subline ? 0.46 : 0.6) * textScale, "900"); cursorY += size; drawOutlinedText(g, headline, cx, cursorY, size, fill, stroke); cursorY += size * 0.18; }
      if (subline) { const size = fitFont(g, subline, hz.w, hz.h * 0.34 * textScale, "700"); cursorY += size; drawOutlinedText(g, subline, cx, cursorY, size, fill, stroke); }

      const badge = $("badge").value.trim();
      if (badge) {
        const size = Math.round(W * 0.034 * textScale);
        g.font = "700 " + size + "px 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif";
        const padX = size * 0.7, padY = size * 0.45, bw = g.measureText(badge).width + padX * 2, bh = size + padY * 2, margin = W * 0.03;
        const bx = z.badge === "top-left" ? margin : W - margin - bw, by = margin;
        g.fillStyle = pal.badgeColor || "#D9520A"; roundRect(g, bx, by, bw, bh, bh / 2); g.fill();
        g.fillStyle = "#FFFFFF"; g.textAlign = "center"; g.textBaseline = "middle"; g.fillText(badge, bx + bw / 2, by + bh / 2 + size * 0.04);
      }

      if ($("overlayLogo").checked && logoDataUrl) {
        try {
          const logo = await loadImage(logoDataUrl);
          const lh = H * 0.05, lw = logo.naturalWidth / logo.naturalHeight * lh, margin = W * 0.03;
          g.drawImage(logo, z.logo === "top-right" ? W - margin - lw : margin, margin, lw, lh);
        } catch (e) {}
      }

      composedDataUrl = canvas.toDataURL("image/png");
      $("composeResult").innerHTML =
        '<img src="' + composedDataUrl + '">' +
        '<div class="actions"><a href="' + composedDataUrl + '" download="ai-draft.png">下載</a>' +
        '<button onclick="saveToDrive(composedDataUrl.split(\',\')[1], \'ai-draft\', \'composeDriveStatus\', true)">存到雲端硬碟</button></div>' +
        '<div class="status show" id="composeDriveStatus" style="margin-top:6px"></div>';
      setStatus("composeStatus", "合成完成。調整字級或產品大小後可再按一次。", false);
      open("secBrief");
    } catch (e) {
      setStatus("composeStatus", "合成失敗：" + (e && e.message ? e.message : e), true);
    } finally { $("composeBtn").disabled = false; }
  }

  // ---------- ⑤ 需求單 ----------
  function buildBrief() {
    const lines = [];
    lines.push("【橘子工坊 素材需求單】");
    if (ctx && ctx.ok) lines.push("檔期／欄位：" + ctx.sheetName + " " + ctx.columnLabel + " 欄" + (ctx.budgetText ? "（" + ctx.budgetText + "）" : ""));
    lines.push("商品：" + ($("product").value.trim() || "（未填）"));
    if ($("headline").value || $("subline").value || $("badge").value) {
      lines.push("圖上文字：" + [$("headline").value, $("subline").value, $("badge").value].filter(Boolean).join("／"));
    }
    if (copyResult) {
      const picked = selectedCopyIndex >= 0 ? [copyResult.copy1, copyResult.copy2, copyResult.copy3][selectedCopyIndex] : null;
      lines.push("", picked ? "選定文案（" + $("tone").value + "）：\n" + picked : "文案候選（" + $("tone").value + "）：\n" + [copyResult.copy1, copyResult.copy2, copyResult.copy3].map((t, i) => "版本" + (i + 1) + "：\n" + t).join("\n\n"));
    }
    lines.push("", "視覺方向：");
    lines.push("・主色調：" + $("palette").value + ($("palette").value === "自訂" && $("customPalette").value ? "（" + $("customPalette").value + "）" : ""));
    lines.push("・風格：" + $("visualStyle").value + "　版面：" + $("layout").value + "　比例：" + $("ratio").value);
    if (refAnalysis) lines.push("・參考圖重點：" + refAnalysis.summaryZh + (refAnalysis.cautionsZh ? "\n・注意：" + refAnalysis.cautionsZh : ""));
    if ($("refNote").value.trim()) lines.push("・業務補充：" + $("refNote").value.trim());
    lines.push("・參考圖 " + refImages.length + " 張、產品去背圖 " + prodImages.length + " 張（另附）");
    if (currentDriveUrl) lines.push("・AI 草稿：" + currentDriveUrl);
    else if (currentImageBase64) lines.push("・AI 草稿：已生成，請按「存到雲端硬碟」後把連結補進來");
    const text = lines.join("\n");
    $("briefBox").textContent = text; $("briefBox").style.display = "block"; $("briefCopyBtn").style.display = "inline-block";
  }
  function copyBrief(btn) {
    writeClipboard($("briefBox").textContent, () => { btn.textContent = "已複製 ✓"; setTimeout(() => btn.textContent = "複製需求單", 2200); });
  }

  // ---------- 啟動 ----------
  loadFormOptions();
  loadContext();
  loadAssets();
  updateImageInputsHint();
  setInterval(() => loadContext(true), 4000);
</script>
