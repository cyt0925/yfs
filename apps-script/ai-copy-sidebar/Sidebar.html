<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --citrus: #D9520A; --citrus-dark: #B8440A;
    --ink: #1C1815; --ink-2: #453D35; --muted: #6E645A;
    --surface: #F8F5F1; --surface-2: #F1ECE5; --rule: #E3DCD3;
    --good: #1F6B45; --bad: #A32118; --info-bg: #FFF4EC; --warn-bg: #FFF8E1; --warn-fg: #8A6D00;
  }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 12px; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Microsoft JhengHei", sans-serif; font-size: 13px; line-height: 1.5; color: var(--ink); background: #fff; }
  h1 { font-size: 15px; font-weight: 700; margin: 0 0 6px; }
  h2 { font-size: 13px; font-weight: 700; margin: 0; padding: 10px 0 6px; display: flex; align-items: center; gap: 8px; cursor: pointer; user-select: none; }
  h2 .chev { margin-left: auto; color: var(--muted); font-size: 11px; font-weight: 400; }
  section { border-top: 1px solid var(--rule); }
  section .body { padding: 0 0 12px; }
  section.collapsed .body { display: none; }
  section.collapsed h2 .chev::before { content: "▸"; }
  section:not(.collapsed) h2 .chev::before { content: "▾"; }

  .ctx { font-size: 12px; color: var(--muted); margin-bottom: 8px; }
  .ctx b { color: var(--ink); font-weight: 600; }
  .warn { color: var(--bad); }
  .link { color: var(--citrus); cursor: pointer; font-size: 11.5px; background: none; border: 0; padding: 0; }
  .hint { font-size: 11.5px; color: var(--muted); margin-top: 4px; }
  .notice { font-size: 12px; background: var(--warn-bg); color: var(--warn-fg); border: 1px solid #F0E0A0; border-radius: 6px; padding: 5px 8px; margin-top: 6px; display: none; }
  .notice.show { display: block; }

  label { display: block; font-size: 12px; font-weight: 600; color: var(--ink-2); margin: 8px 0 3px; }
  input[type=text], select, textarea { width: 100%; padding: 6px 8px; font-size: 13px; border: 1px solid var(--rule); border-radius: 6px; background: #fff; color: var(--ink); font-family: inherit; }
  textarea { resize: vertical; line-height: 1.45; }
  input:focus, select:focus, textarea:focus { outline: 2px solid var(--citrus); outline-offset: -1px; }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  input[type=range] { width: 100%; }

  .btn { padding: 8px 10px; font-size: 13px; font-weight: 600; border-radius: 8px; cursor: pointer; border: 1px solid var(--citrus); background: #fff; color: var(--citrus); }
  .btn.primary { background: var(--citrus); color: #fff; }
  .btn.primary:hover { background: var(--citrus-dark); }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  .btn.ghost { border-color: var(--rule); color: var(--ink-2); font-weight: 500; }
  .btns { display: flex; gap: 6px; margin-top: 8px; }
  .btns .btn { flex: 1; }
  .status { margin-top: 6px; font-size: 12px; color: var(--muted); display: none; white-space: pre-wrap; }
  .status.show { display: block; }
  .status.error { color: var(--bad); }

  .chips { display: flex; gap: 4px; flex-wrap: wrap; }
  .chip { font-size: 11.5px; padding: 3px 9px; border: 1px solid var(--rule); border-radius: 12px; background: #fff; cursor: pointer; color: var(--ink-2); user-select: none; }
  .chip.on { border-color: var(--citrus); color: var(--citrus); background: var(--info-bg); font-weight: 600; }
  .chipgroups { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 6px; align-items: center; }

  .drop { border: 2px dashed var(--rule); border-radius: 10px; padding: 10px; text-align: center; background: var(--surface); color: var(--muted); font-size: 12px; cursor: pointer; }
  .drop:hover, .drop.over { border-color: var(--citrus); background: var(--info-bg); color: var(--ink-2); }
  .drop b { color: var(--citrus); }
  .drop input[type=file] { display: none; }
  .tray { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
  .tile { position: relative; width: 84px; border: 2px solid var(--rule); border-radius: 8px; padding: 3px; background: #fff; }
  .tile.prod { border-color: var(--citrus); }
  .tile.layout { border-color: #1B4F9C; }
  .tile.logo { border-color: var(--good); }
  .tile.layout .kind { border-color: #1B4F9C; color: #1B4F9C; font-weight: 600; }
  .tile.logo .kind { border-color: var(--good); color: var(--good); font-weight: 600; }
  .tile.opaque { border-color: #E0B000; background: var(--warn-bg); }
  .tile img { width: 100%; height: 56px; object-fit: contain; display: block; border-radius: 4px; background: repeating-conic-gradient(#f3f0eb 0 25%, #fff 0 50%) 0 0 / 10px 10px; }
  .tile .kind { display: block; width: 100%; margin-top: 3px; font-size: 10.5px; padding: 1px 0; border: 1px solid var(--rule); border-radius: 8px; background: #fff; cursor: pointer; color: var(--ink-2); text-align: center; }
  .tile.prod .kind { border-color: var(--citrus); color: var(--citrus); font-weight: 600; }
  .tile .x { position: absolute; top: -6px; right: -6px; width: 16px; height: 16px; border-radius: 50%; background: var(--ink); color: #fff; border: 0; font-size: 10px; line-height: 16px; cursor: pointer; padding: 0; }
  .tile.lib { cursor: pointer; opacity: .85; }
  .urlrow { display: flex; gap: 6px; margin-top: 6px; }
  .urlrow input { flex: 1; font-size: 12px; padding: 4px 8px; }
  .urlrow .btn { padding: 4px 10px; font-size: 12px; }

  .chatlog { display: grid; gap: 6px; margin-top: 8px; }
  .bubble { border-radius: 10px; padding: 6px 10px; font-size: 12.5px; }
  .bubble.user { background: var(--surface-2); justify-self: end; white-space: pre-wrap; max-width: 90%; }
  .bubble.ai { background: var(--info-bg); border: 1px solid #F3D9C4; color: var(--ink-2); }

  .stage-wrap { margin-top: 8px; display: none; }
  #stage { width: 100%; display: block; border-radius: 8px; border: 1px solid var(--rule); touch-action: none; cursor: grab; background: var(--surface); }
  #stage.dragging { cursor: grabbing; }
  .versions { display: flex; gap: 6px; margin-top: 6px; overflow-x: auto; }
  .versions img { height: 56px; border-radius: 6px; border: 2px solid var(--rule); cursor: pointer; flex: 0 0 auto; }
  .versions img.current { border-color: var(--citrus); }
  details.more { margin-top: 6px; }
  details.more summary { font-size: 12px; color: var(--muted); cursor: pointer; }

  .angles { display: grid; gap: 6px; margin-top: 8px; }
  .angle { border: 1px solid var(--rule); border-radius: 8px; padding: 7px 10px; cursor: pointer; background: #fff; }
  .angle.selected { border-color: var(--citrus); background: var(--info-bg); }
  .angle .t { font-weight: 700; font-size: 12.5px; }
  .angle .h { font-size: 12.5px; }
  .angle .w { font-size: 11.5px; color: var(--muted); }
  .cards { display: grid; gap: 8px; margin-top: 8px; }
  .card { border: 1px solid var(--rule); border-radius: 8px; padding: 8px 10px; background: var(--surface); cursor: pointer; }
  .card.selected { border-color: var(--citrus); background: var(--info-bg); }
  .card .text { white-space: pre-wrap; font-size: 13px; }
  .card .foot { display: flex; justify-content: space-between; align-items: center; margin-top: 6px; font-size: 11px; color: var(--muted); }
  .brief { white-space: pre-wrap; font-size: 12px; background: var(--surface); border: 1px solid var(--rule); border-radius: 8px; padding: 10px; margin-top: 8px; display: none; }
</style>

<h1>🍊 AI 文案助手</h1>
<div class="ctx" id="ctx">讀取中…</div>

<!-- 文案 -->
<section id="secCopy">
  <h2 onclick="toggle('secCopy')">文案<span class="chev"></span></h2>
  <div class="body">
    <div class="two">
      <div><label style="margin-top:0">商品</label><input type="text" id="product" placeholder="洗衣膠囊*3盒" oninput="productTouched = true; checkMismatch()"></div>
      <div><label style="margin-top:0">調性</label><select id="tone"></select></div>
    </div>
    <div class="hint" id="productInfoHint"></div>
    <label>時事／梗料 <span style="font-weight:400;color:var(--muted)">（選填）</span></label>
    <textarea id="trend" style="min-height:44px" placeholder="事件＋跟洗衣清潔的關聯，例：颱風假在家追劇，衣服堆到週一"></textarea>
    <input type="text" id="sellingPoint" style="margin-top:6px" placeholder="補充賣點（選填）">
    <div class="btns">
      <button class="btn" id="angleBtn" onclick="proposeAngles()">先提 5 個切角</button>
      <button class="btn primary" id="genCopyBtn" onclick="generateCopy()">生成 3 版文案</button>
    </div>
    <div class="status" id="copyStatus"></div>
    <div class="angles" id="angles"></div>
    <div class="cards" id="cards"></div>
  </div>
</section>

<!-- 圖 -->
<section id="secImage">
  <h2 onclick="toggle('secImage')">圖<span class="chev"></span></h2>
  <div class="body">
    <div class="drop" id="drop" onclick="document.getElementById('fileAny').click()">
      <b>把參考圖、自家舊稿（版型）、產品去背圖、logo 拖進來</b>，或 Ctrl+V 貼上。點標籤切換類型
      <input type="file" id="fileAny" accept="image/*" multiple onchange="addFiles(this.files); this.value=''">
    </div>
    <div class="urlrow"><input type="text" id="urlInput" placeholder="或貼圖片網址"><button class="btn ghost" onclick="addUrl()">加入</button></div>
    <div class="tray" id="tray"></div>
    <div class="notice" id="trayNotice"></div>
    <div class="status" id="trayStatus"></div>

    <div class="chatlog" id="chatLog"></div>
    <textarea id="chatText" style="min-height:72px;margin-top:8px" placeholder="用中文說這張圖要長什麼樣。產圖後繼續打字＝修改上一張。"></textarea>
    <div class="chipgroups">
      <div class="chips" id="modeChips"><span class="chip on" data-v="full">完整稿</span><span class="chip" data-v="background">只畫背景</span></div>
      <div class="chips" id="qualityChips"><span class="chip" data-v="low">草稿</span><span class="chip on" data-v="medium">一般</span><span class="chip" data-v="high">精細</span></div>
      <div class="chips" id="ratioChips"></div>
    </div>
    <div class="btns">
      <button class="btn ghost" id="resetChatBtn" onclick="resetChat()" disabled>重來</button>
      <button class="btn primary" id="sendBtn" onclick="sendChat()" style="flex:2">產圖</button>
    </div>
    <div class="status" id="imageStatus"></div>

    <div class="stage-wrap" id="stageWrap">
      <canvas id="stage"></canvas>
      <div class="versions" id="versions"></div>
      <div class="chipgroups" style="margin-top:8px">
        <div class="chips"><span class="chip" id="chipText" onclick="toggleOverlay('overlayText')">疊標題</span><span class="chip" id="chipProd" onclick="toggleOverlay('overlayProducts')">疊產品</span><span class="chip" id="chipLogo" onclick="toggleOverlay('overlayLogo')">疊 logo</span></div>
        <button class="link" onclick="autoPlaceHeadline()">標題自動找留白</button>
      </div>
      <details class="more">
        <summary>圖上文字、字色、大小</summary>
        <input type="text" id="headline" placeholder="主標（空白就用選定文案第一行）" style="margin-top:6px" oninput="checkMismatch(); scheduleRender()">
        <input type="text" id="subline" placeholder="優惠（例：買2箱送150點）" style="margin-top:6px" oninput="checkMismatch(); scheduleRender()">
        <div class="two" style="margin-top:6px">
          <input type="text" id="price" placeholder="價格（例：$5.7/顆 up）" oninput="scheduleRender()">
          <input type="text" id="badge" placeholder="檔期（例：6/13 momo限定）" oninput="scheduleRender()">
        </div>
        <input type="text" id="note" placeholder="小字註記（例：限量須登記）" style="margin-top:6px">
        <div class="notice" id="mismatchNotice"></div>
        <div class="two" style="margin-top:6px">
          <select id="palette" onchange="onPaletteChange(); scheduleRender()"></select>
          <select id="textColor" onchange="scheduleRender()">
            <option value="auto">字色：依主色調</option>
            <option value="#FFFFFF|#B8440A">白字橘邊</option>
            <option value="#FFFFFF|#1B4F9C">白字藍邊</option>
            <option value="#FFFFFF|#222222">白字黑邊</option>
            <option value="#D9520A|#FFFFFF">橘字白邊</option>
            <option value="#1B3F8B|#FFFFFF">藍字白邊</option>
            <option value="#1C1815|#FFFFFF">黑字白邊</option>
          </select>
        </div>
        <div class="two" style="margin-top:6px">
          <div><label style="margin:0;font-weight:400">字級</label><input type="range" id="textScale" min="50" max="180" value="100" oninput="scheduleRender()"></div>
          <div><label style="margin:0;font-weight:400">產品大小</label><input type="range" id="productScale" min="40" max="180" value="100" oninput="scheduleRender()"></div>
        </div>
        <select id="layout" style="margin-top:6px" onchange="resetPositions()"></select>
        <textarea id="composeNote" style="min-height:40px;margin-top:6px" placeholder="給設計師的備註（進需求單）"></textarea>
      </details>
      <div class="btns">
        <a class="btn ghost" id="downloadDraft" href="#" download="ai-draft.png" style="text-align:center;text-decoration:none">下載</a>
        <button class="btn ghost" onclick="saveDraft()">存雲端</button>
        <button class="btn" onclick="buildBrief()">需求單</button>
      </div>
      <div class="status" id="composeStatus"></div>
      <div class="brief" id="briefBox"></div>
    </div>

    <details class="more" style="margin-top:8px">
      <summary>常用素材庫、除錯</summary>
      <div class="hint" id="libHint">讀取中…</div>
      <div class="tray" id="libTray"></div>
      <button class="link" onclick="loadAssets()">重新讀取素材庫</button>
      <label>模型實際用的生圖指令</label>
      <textarea id="promptEn" readonly style="min-height:60px;font-size:11px;background:var(--surface)"></textarea>
      <label style="font-weight:400"><input type="checkbox" id="sendRefs" checked> 第一輪附參考圖給模型</label>
    </details>
  </div>
</section>

<script>
  // ---------- 狀態 ----------
  let options = null, ctx = null, productTouched = false, lastContextKey = "";
  let angles = [], selectedAngle = null, copyResult = null, selectedCopyIndex = -1, copyScene = "";
  let chatTouched = false, chat = { responseId: "", turns: [] };
  const images = [];              // {id, name, mime, base64, dataUrl, kind:'ref'|'prod', opaque}
  let logoDataUrl = "";
  let currentImageBase64 = "", currentDriveUrl = "";
  const overlay = { overlayText: true, overlayProducts: true, overlayLogo: true };
  const CATEGORY_KWS = ["洗衣膠囊", "膠囊", "洗衣精", "洗碗精", "洗衣槽", "地板", "蔬果", "洗手"];
  let uid = 0;

  const $ = id => document.getElementById(id);
  const toggle = id => $(id).classList.toggle("collapsed");
  const open = id => $(id).classList.remove("collapsed");
  const esc = s => String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  function setStatus(id, msg, err) { const el = $(id); el.textContent = msg || ""; el.className = "status" + (msg ? " show" : "") + (err ? " error" : ""); }
  function setNotice(id, msg) { const el = $(id); el.textContent = msg || ""; el.className = "notice" + (msg ? " show" : ""); }
  function run(fn) { return (...a) => new Promise((ok, no) => google.script.run.withSuccessHandler(ok).withFailureHandler(no)[fn](...a)); }
  function chipValue(groupId) { const on = $(groupId).querySelector(".chip.on"); return on ? on.dataset.v : ""; }
  function bindChips(groupId, onChange) {
    $(groupId).addEventListener("click", e => {
      const c = e.target.closest(".chip"); if (!c) return;
      $(groupId).querySelectorAll(".chip").forEach(x => x.classList.remove("on")); c.classList.add("on");
      if (onChange) onChange(c.dataset.v);
    });
  }
  const KINDS = ["ref", "layout", "prod", "logo"], KIND_LABEL = { ref: "參考", layout: "版型", prod: "產品", logo: "logo" };
  const byKind = k => images.filter(i => i.kind === k);
  const prods = () => byKind("prod"), refs = () => byKind("ref"), layouts = () => byKind("layout"), logos = () => byKind("logo");

  // ---------- 初始化 ----------
  function loadFormOptions() {
    run("getFormOptions")().then(o => {
      options = o;
      $("tone").innerHTML = '<option value="">調性</option>' + o.tones.map(t => '<option>' + esc(t) + '</option>').join("");
      $("palette").innerHTML = o.palettes.map(p => '<option value="' + esc(p.key) + '">主色調：' + esc(p.key) + '</option>').join("");
      $("layout").innerHTML = o.layouts.map(l => '<option value="' + esc(l.key) + '">版面：' + esc(l.key) + '</option>').join("");
      $("ratioChips").innerHTML = o.ratios.map((r, i) => '<span class="chip' + (i === 0 ? ' on' : '') + '" data-v="' + r + '">' + r + '</span>').join("");
    });
  }
  function loadContext(silent) {
    run("getColumnContext")().then(c => {
      const key = JSON.stringify(c); if (silent && key === lastContextKey) return;
      lastContextKey = key; ctx = c; renderContext(c);
    }).catch(err => { if (!silent) $("ctx").innerHTML = '<span class="warn">' + esc(err.message) + '</span>'; });
  }
  function renderContext(c) {
    if (!c.ok) { $("ctx").innerHTML = '<span class="warn">' + esc(c.message) + '</span>'; return; }
    if (!productTouched) $("product").value = c.product || "";
    $("productInfoHint").textContent = c.productInfo ? "賣點：" + c.productInfo.sellingPoints : "";
    prefillCompose(c); checkMismatch();
    $("ctx").innerHTML = '<b>' + esc(c.sheetName) + '</b> ' + esc(c.columnLabel) + ' 欄　' + esc(c.adName || c.product || "") +
      (c.hasApiKey ? "" : '　<span class="warn">尚未設定 API Key（選單 → AI 文案工具）</span>') +
      '　<button class="link" onclick="productTouched=false; loadContext()">重讀</button>';
  }
  function prefillCompose(c) {
    const lines = String(c.copyText || "").split(/\r?\n/).map(s => s.trim()).filter(Boolean);
    const clean = s => s.replace(/^[^一-鿿\w$￥]+/, "").replace(/[^一-鿿\w$%)）]+$/, "").trim();
    const offers = lines.filter(l => /(滿|買)\s*\$?\s*\d/.test(l) && /(折|送|贈)/.test(l));
    const prices = lines.filter(l => /(下殺|直降|特價|\$\s*\d)/.test(l) && !/(滿|買)\s*\$?\s*\d.*送/.test(l));
    if (!$("subline").value && offers[0]) {
      let o = clean(offers[0]);
      const paren = o.match(/[（(]([^）)]{2,12})[）)]\s*$/);
      if (paren) { o = o.replace(paren[0], "").trim(); if (!$("note").value) $("note").value = paren[1]; }
      $("subline").value = o;
    }
    if (!$("note").value) { const n = lines.find(l => /(限量|須登記|需登記|僅供參考|依網頁公告)/.test(l) && l.length <= 20); if (n) $("note").value = clean(n); }
    if (!$("price").value && prices[0]) { const m = prices[0].match(/\$?\s*[\d,]+(?:\.\d+)?\s*(?:\/\s*[一-鿿a-zA-Z]+)?(?:\s*up)?/i); $("price").value = m ? ("$" + m[0].replace(/^\$?\s*/, "").trim()) : clean(prices[0]); }
    if (!$("badge").value) { const m = (String(c.budgetText || "") + " " + String(c.copyText || "") + " " + String(c.adName || "")).match(/(\d{1,2}\/\d{1,2})(?:\s*[-~～–]\s*\d{1,2}\/\d{1,2})?/); if (m) $("badge").value = m[1] + " momo限定"; }
  }
  function checkMismatch() {
    const product = ($("product").value + " " + (ctx && ctx.ok ? ctx.adName : "")).toLowerCase();
    const text = ($("headline").value + " " + $("subline").value).toLowerCase();
    const inText = CATEGORY_KWS.filter(k => text.indexOf(k.toLowerCase()) !== -1), inProduct = CATEGORY_KWS.filter(k => product.indexOf(k.toLowerCase()) !== -1);
    const conflict = inText.filter(k => !inProduct.some(p => p.indexOf(k) !== -1 || k.indexOf(p) !== -1));
    setNotice("mismatchNotice", conflict.length && inProduct.length ? "標題提到「" + conflict.join("、") + "」，但這欄商品是「" + inProduct.join("、") + "」" : "");
  }

  // ---------- 文案 ----------
  function copyInput() {
    return { product: $("product").value.trim(), sellingPoint: $("sellingPoint").value.trim(), tone: $("tone").value, trend: $("trend").value.trim(), angle: selectedAngle, productInfo: ctx ? ctx.productInfo : null };
  }
  function proposeAngles() {
    const i = copyInput();
    if (!i.product) return setStatus("copyStatus", "先填商品。", true);
    if (!i.trend) return setStatus("copyStatus", "沒有時事就直接按「生成 3 版文案」。", true);
    $("angleBtn").disabled = true; $("angles").innerHTML = ""; selectedAngle = null; setStatus("copyStatus", "想切角中…", false);
    run("proposeAngles")(i).then(r => { $("angleBtn").disabled = false; setStatus("copyStatus", "點一個切角再生成；不選也可以。", false); angles = r.angles || []; renderAngles(); })
      .catch(e => { $("angleBtn").disabled = false; setStatus("copyStatus", e.message, true); });
  }
  function renderAngles() {
    $("angles").innerHTML = angles.map((a, i) => '<div class="angle' + (selectedAngle === a ? ' selected' : '') + '" onclick="selectAngle(' + i + ')"><div class="t">' + esc(a.title) + '</div><div class="h">' + esc(a.hook) + '</div><div class="w">' + esc(a.why) + '</div></div>').join("");
  }
  function selectAngle(i) { selectedAngle = selectedAngle === angles[i] ? null : angles[i]; renderAngles(); }
  function generateCopy() {
    const i = copyInput();
    if (!i.product || !i.tone) return setStatus("copyStatus", "先填商品、選調性。", true);
    $("genCopyBtn").disabled = true; $("cards").innerHTML = ""; setStatus("copyStatus", "生成中…", false);
    run("generateCopy")(i).then(r => {

  })();
  function saveDraft() {
    if (!bgImg) return;
    setStatus("composeStatus", "儲存中…", false);
    run("saveImageToDrive")({ base64: full.toDataURL("image/png").split(",")[1], filename: "ai-draft-" + Date.now() })
      .then(r => { currentDriveUrl = r.url; $("composeStatus").innerHTML = '已存入雲端硬碟：<a href="' + r.url + '" target="_blank">開啟</a>'; $("composeStatus").className = "status show"; })
      .catch(e => setStatus("composeStatus", e.message, true));
  }

  // ---------- 需求單 ----------
  function buildBrief() {
    const L = ["【橘子工坊 素材需求單】"];
    if (ctx && ctx.ok) L.push("檔期／欄位：" + ctx.sheetName + " " + ctx.columnLabel + " 欄" + (ctx.budgetText ? "（" + ctx.budgetText + "）" : ""));
    L.push("商品：" + ($("product").value.trim() || "（未填）"));
    const t = [$("headline").value, $("subline").value, $("price").value, $("badge").value, $("note").value].filter(Boolean).join("／"); if (t) L.push("圖上文字：" + t);
    if (copyResult) { const p = selectedCopyIndex >= 0 ? [copyResult.copy1, copyResult.copy2, copyResult.copy3][selectedCopyIndex] : null; L.push("", p ? "選定文案（" + $("tone").value + "）：\n" + p : "文案候選：\n" + [copyResult.copy1, copyResult.copy2, copyResult.copy3].map((x, i) => "版本" + (i + 1) + "：\n" + x).join("\n\n")); }
    L.push("", "視覺：" + (chipValue("modeChips") === "background" ? "只畫背景＋程式疊字" : "完整稿") + "　比例 " + (chipValue("ratioChips") || "9:16") + "　主色調 " + $("palette").value);
    if (chat.turns.length) L.push("生圖對話：\n" + chat.turns.map((x, i) => "  " + (i + 1) + ". " + x.text).join("\n"));
    L.push("參考圖 " + refs().length + " 張、版型 " + layouts().length + " 張、產品去背圖 " + prods().length + " 張、logo " + logos().length + " 張（另附）");
    if ($("composeNote").value.trim()) L.push("備註：" + $("composeNote").value.trim());
    L.push(currentDriveUrl ? "AI 草稿：" + currentDriveUrl : "AI 草稿：請先按「存雲端」取得連結");
    L.push("AI 草稿僅供構圖與氛圍參考，產品與文字以原始檔為準。");
    const box = $("briefBox"); box.textContent = L.join("\n"); box.style.display = "block";
    writeClipboard(box.textContent, () => setStatus("composeStatus", "需求單已複製到剪貼簿。", false));
  }

  // ---------- 啟動 ----------
  loadFormOptions(); loadContext(); loadAssets(); updateOverlayChips();
  setInterval(() => loadContext(true), 4000);
</script>
