<!DOCTYPE html>
<html lang="zh-Hant" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>今日運彩總覽</title>
<meta name="description" content="今日賽事、盤口、傷兵、火燙球員與建議，一頁看完。">
<meta name="theme-color" content="#0b0a14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="運彩總覽">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;800&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body data-view="games" data-sport="all">

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-grid" viewBox="0 0 24 24"><path d="M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></symbol>
    <symbol id="i-basketball" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><path d="M3.5 9.5c3 1 6 4 6 8.5M20.5 9.5c-3 1-6 4-6 8.5M3 12h18M12 3v18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
    <symbol id="i-soccer" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 7.5l4 3-1.5 4.5h-5L8 10.5z" fill="currentColor"/><path d="M12 3v4.5M16 10.5l4-1.5M14.5 15l2.5 4M9.5 15l-2.5 4M8 10.5L4 9" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
    <symbol id="i-hockey" viewBox="0 0 24 24"><path d="M4 4l7 12 2 4h4" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="8" cy="18.5" rx="4.5" ry="2" fill="currentColor"/></symbol>
    <symbol id="i-tennis" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><path d="M5.5 6c4 1.5 6.5 4.5 6.5 9s-2 5-2 5M18.5 6c-4 1.5-6.5 4.5-6.5 9" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
    <symbol id="i-football" viewBox="0 0 24 24"><path d="M4.5 19.5C2.5 17.5 5 8 10 5s12-2.5 9.5 0.5 1.5 9.5-3.5 13.5-9.5 2.5-11.5 0.5z" fill="none" stroke="currentColor" stroke-width="2"/><path d="M9 15l6-6M10 12l2 2M12 10l2 2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
    <symbol id="i-fire" viewBox="0 0 24 24"><path d="M12 2c1 4 5 5.5 5 11a5 5 0 0 1-10 0c0-2 1-3.5 2-4.5 0 2 1 3 2 3 0-3 0-6 1-9.5z" fill="currentColor"/></symbol>
    <symbol id="i-snow" viewBox="0 0 24 24"><path d="M12 2v20M4 7l16 10M20 7L4 17M12 2l-2.5 2.5M12 2l2.5 2.5M12 22l-2.5-2.5M12 22l2.5-2.5M4 7l3.4-.6M4 7l.6 3.4M20 17l-3.4.6M20 17l-.6-3.4M20 7l-3.4-.6M20 7l-.6 3.4M4 17l3.4.6M4 17l.6-3.4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
    <symbol id="i-med" viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="14" rx="3" fill="none" stroke="currentColor" stroke-width="2"/><path d="M9 6V4h6v2M12 10v6M9 13h6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
    <symbol id="i-news" viewBox="0 0 24 24"><path d="M4 5h13v14H6a2 2 0 0 1-2-2zM17 9h3v8a2 2 0 0 1-2 2M7 9h7M7 13h7M7 16h4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 7v5l3 2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
    <symbol id="i-chev" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-star" viewBox="0 0 24 24"><path d="M12 2.5l2.9 6.2 6.6.8-4.9 4.6 1.3 6.6L12 17.5l-5.9 3.2 1.3-6.6L2.5 9.5l6.6-.8z" fill="currentColor"/></symbol>
    <symbol id="i-trophy" viewBox="0 0 24 24"><path d="M7 4h10v5a5 5 0 0 1-10 0zM7 6H4a3 3 0 0 0 3 4M17 6h3a3 3 0 0 1-3 4M12 14v4M8 20h8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
    <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></symbol>
    <symbol id="i-list" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></symbol>
    <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.3-5.7M20 4v5h-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-live" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4" fill="currentColor"/><path d="M6.3 6.3a8 8 0 0 0 0 11.4M17.7 6.3a8 8 0 0 1 0 11.4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
    <symbol id="i-pin" viewBox="0 0 24 24"><path d="M12 21s-6-5.3-6-11a6 6 0 0 1 12 0c0 5.7-6 11-6 11z" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="10" r="2.2" fill="currentColor"/></symbol>
    <symbol id="i-tv" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="12" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M8 21h8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-warn" viewBox="0 0 24 24"><path d="M12 3l10 18H2z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M12 10v5M12 18v.5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></symbol>
  </defs>
</svg>

<header class="top">
  <div class="brand">
    <span class="brand-mark"><svg><use href="#i-star"/></svg></span>
    <div>
      <div class="brand-name">今日運彩總覽</div>
      <div class="brand-sub" id="hdr-date">載入中…</div>
    </div>
  </div>
  <div class="top-right">
    <button class="icon-btn" id="btn-refresh" title="重新整理" aria-label="重新整理"><svg><use href="#i-refresh"/></svg></button>
    <button class="icon-btn" id="btn-theme" title="切換深淺色" aria-label="切換深淺色"><svg><use href="#i-sun"/></svg></button>
    <span class="updated" id="hdr-updated"></span>
  </div>
</header>

<nav class="chips" id="chips" aria-label="球種"></nav>

<div class="layout">
  <main>
    <section id="sec-picks" class="sec">
      <h2 class="sec-title"><svg><use href="#i-star"/></svg>今日建議</h2>
      <div id="picks"></div>
    </section>

    <section id="sec-live" class="sec">
      <h2 class="sec-title live-title"><svg><use href="#i-live"/></svg>進行中</h2>
      <div id="live" class="cards"></div>
    </section>

    <section id="sec-games" class="sec">
      <h2 class="sec-title"><svg><use href="#i-clock"/></svg>賽事</h2>
      <div id="games"></div>
    </section>
  </main>

  <aside>
    <section id="sec-injuries" class="sec">
      <h2 class="sec-title"><svg><use href="#i-med"/></svg>傷兵快報</h2>
      <div id="injuries" class="aside-list"></div>
    </section>
    <section id="sec-hot" class="sec">
      <h2 class="sec-title"><svg><use href="#i-fire"/></svg>火燙 / 冰冷球員</h2>
      <div id="hot" class="aside-list"></div>
    </section>
    <section id="sec-standings" class="sec">
      <h2 class="sec-title"><svg><use href="#i-trophy"/></svg>排名</h2>
      <div id="standings"></div>
    </section>
  </aside>
</div>

<footer class="foot">
  <div id="foot-src"></div>
  <div class="foot-note">本站只整理資料與規則式建議，不代表任何投注結果。台灣盤口以玩運彩頁面為準，可能有延遲，下注前請再看一次台灣運彩的最新賠率。</div>
</footer>

<nav class="bottom-nav" aria-label="主選單">
  <button data-view="games" class="on"><svg><use href="#i-clock"/></svg><span>賽事</span></button>
  <button data-view="picks"><svg><use href="#i-star"/></svg><span>建議</span></button>
  <button data-view="injuries"><svg><use href="#i-med"/></svg><span>傷兵</span></button>
  <button data-view="standings"><svg><use href="#i-trophy"/></svg><span>排名</span></button>
</nav>

<script src="app.js"></script>
</body>
</html>
