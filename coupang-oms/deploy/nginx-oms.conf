# 酷澎訂單管理系統／採購表轉換／SOP 檢索站 —— nginx 反向代理設定片段
#
# 這不是一份完整的 nginx.conf，是要「嵌進」戰情室既有 server 區塊裡的
# 片段（見 warroom-merge-whitepaper.html 決策一：走子路徑 /oms，不是
# 獨立網域）。真正要改的地方是 GCP 那台 VM 上戰情室現有的 nginx 設定，
# 這份檔案只是先把內容寫好、進版控，拿到 VM 存取權之後貼進對的位置。
#
# 用法：把下面整段 `location` 區塊複製進戰情室 server{} 裡（跟其他
# location 平行放），不要新建一個獨立的 server{}——目的就是同一個
# 網域、同一張憑證，不要多開一個站。

# -------------------------------------------------------------------
# 酷澎訂單管理系統 + 採購表轉換（同一支 Flask app，見 app.py／purchase.py）
# -------------------------------------------------------------------
location /oms/ {
    # 上傳大小上限：Flask 端 app.py 設的是 64MB
    # (app.config["MAX_CONTENT_LENGTH"] = 64 * 1024 * 1024)，
    # nginx 預設只有 1MB，兩邊沒對齊的話，nginx 會在 Flask 看到請求前
    # 就先擋下大檔案、回 413，使用者會看到跟平常不一樣的錯誤畫面，
    # 而且畫面上完全看不出是 nginx 擋的還是 Flask 擋的，很難排查。
    client_max_body_size 64m;

    # gunicorn 只綁在本機、不對外開埠（見白皮書 5.4），這裡是唯一入口
    proxy_pass http://127.0.0.1:8001/;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # 掛在子路徑下，Flask（或它產生的連結／靜態資源路徑）要知道自己
    # 前面多了 /oms 這一截，不然登入轉址、連結、圖檔路徑都會少掉
    # 這一截、看起來像壞掉但其實只是路徑對不上（見白皮書 5.6）。
    proxy_set_header X-Forwarded-Prefix /oms;

    # 上傳／匯出可能要處理大檔案（整份整合表、附簽名的 PDF），
    # 拉長逾時，不要讓 nginx 比 Flask 還早放棄這個請求
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
}

# 健康檢查端點（app.py 的 /healthz，不需要登入）單獨開一條路徑，
# 方便部署腳本或監控直接打 /oms/healthz，不用先過登入判斷
location = /oms/healthz {
    proxy_pass http://127.0.0.1:8001/healthz;
    proxy_set_header Host $host;
}

# -------------------------------------------------------------------
# SOP 檢索站（純靜態檔，index.html + img/，不需要經過 Flask）
# -------------------------------------------------------------------
# 部署時把 repo 根目錄的 index.html、img/、config.js、404.html
# 複製到 VM 上的這個路徑（例如 /opt/oms/sop-site/），nginx 直接送檔，
# 不要繞經 Python——省下的記憶體留給白皮書 5.1 講的同機資源競爭問題。
location /sop/ {
    alias /opt/oms/sop-site/;
    try_files $uri $uri/ /sop/index.html;
}
